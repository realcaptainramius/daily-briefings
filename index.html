<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>David's Daily Briefings</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f7f7f5;
    color: #1f1f1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 20px; letter-spacing: -0.01em; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .list a {
    display: block; background: #ffffff; border: 1px solid #e6e6e0; border-radius: 10px;
    padding: 14px 16px; color: #1f1f1f; text-decoration: none; font-size: 14.5px; font-weight: 600;
  }
  .list a:hover { background: #f0f0ec; }
  footer { margin-top: 32px; font-size: 12px; color: #888; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Daily News Briefings</h1>
  <div class="list">
    <a href="/space">Space Weekly Briefing</a>
    <a href="/dow">DoW Daily Briefing</a>
    <a href="/ai">AI Daily Briefing</a>
    <a href="/cyber">Cybersecurity Daily Briefing</a>
    <a href="/wwt">WWT &harr; USAF/USSF Signal Mapping</a>
  </div>
  <footer>Updated weekday mornings at 6am Central.</footer>
</div>
</body>
</html>
